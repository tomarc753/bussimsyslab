<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Bus Simulation Map</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <link rel="stylesheet" href="dist/leaflet.css" />
    <style>
        body {
            background-color: skyblue;
            margin: 20px;
            font-family: Arial, sans-serif;
        }

        h1, h2 {
            text-align: center;
        }

        .map-panel {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .map-sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #map {
            width: 900px;
            height: 580px;
            border: 1px solid black;
        }

        #busstats {
            width: 200px;
            height: 580px;
            resize: vertical;
        }

        #logs {
            width: 200px;
            height: 580px;
            resize: vertical;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .simulation-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button, select {
            width: 215px;
            height: 50px;
        }

        #incident {
            background-color: red;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Bus Reroute Simulation</h1>

    <div class="map-panel">
        <div class="map-sidebar">
            <input id="logs" type="text" placeholder="Simulation Logs" readonly/>
        </div>
        <div id="map"></div>
        <div class="map-sidebar">
            <input id="busstats" type="text" placeholder="Bus Statistics" readonly/>
        </div>
    </div>

    <h2>Simulation Controls</h2>

    <div class="controls">
        <button id="startButton">Start/Pause</button>
        <button id="resetButton">Reset</button>

        <select id="algorithmDropdown">
            <option value="algorithm1">Split Response</option>
            <option value="algorithm2">Capacity Constrained</option>
            <option value="algorithm3">Even Cost</option>
        </select>

        <select id="simulationspeed">
            <option value="1">0.25x</option>
            <option value="2">0.5x</option>
            <option value="3">1x</option>
            <option value="4">2x</option>
            <option value="5">5x</option>
        </select>

    </div>

    <div class="simulation-actions">
        <button id="incident">Trigger Incident</button>
    </div>

    <script src="dist/leaflet.js"></script>
    <script src="dist/mymap.js"></script>
    <script src="dist/simulation.js"></script>
</body>
</html>
